<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Ben10 Ultimate Calc</title>

<link rel="stylesheet" href="style.css?v=55555">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- BACKGROUND -->

<div class="bg"></div>

<div class="energy-ring"></div>

<div class="energy-ring ring2"></div>

<!-- BEN10 DEVICE -->

<div class="omnitrix-device">

<!-- TOP -->

<div class="top-panel">

<div class="logo">
ULTIMATE CALC
</div>

<div class="top-buttons">

<button id="themeToggle">🟢</button>

<button id="voiceBtn">🎤</button>

<button id="dragBtn">⚡</button>

</div>

</div>

<!-- DISPLAY -->

<div class="display-box">

<input type="text" id="display" disabled>

</div>

<!-- SCI BUTTON -->

<button id="scientificToggle">

ULTIMATE MODE

</button>

<!-- SCIENTIFIC -->

<div class="scientific-buttons hidden"
id="scientificButtons">

<button onclick="appendValue('Math.sin(')">sin</button>

<button onclick="appendValue('Math.cos(')">cos</button>

<button onclick="appendValue('Math.tan(')">tan</button>

<button onclick="appendValue('Math.sqrt(')">√</button>

</div>

<!-- CALCULATOR -->

<div class="calculator-grid">

<button onclick="clearDisplay()">C</button>

<button onclick="deleteLast()">DEL</button>

<button onclick="appendValue('%')">%</button>

<button class="op" onclick="appendValue('/')">÷</button>

<button onclick="appendValue('7')">7</button>

<button onclick="appendValue('8')">8</button>

<button onclick="appendValue('9')">9</button>

<button class="op" onclick="appendValue('*')">×</button>

<button onclick="appendValue('4')">4</button>

<button onclick="appendValue('5')">5</button>

<button onclick="appendValue('6')">6</button>

<button class="op" onclick="appendValue('-')">−</button>

<button onclick="appendValue('1')">1</button>

<button onclick="appendValue('2')">2</button>

<button onclick="appendValue('3')">3</button>

<button class="op" onclick="appendValue('+')">+</button>

<button class="zero"
onclick="appendValue('0')">0</button>

<button onclick="appendValue('.')">.</button>

<button class="equal"
onclick="calculate()">=</button>

</div>

<!-- FEATURES -->

<div class="feature-panels">

<!-- Currency -->

<div class="feature-card">

<h2>💸 Currency</h2>

<input type="number"
id="amount"
placeholder="Enter Amount">

<select id="fromCurrency">

<option>USD</option>
<option>INR</option>
<option>EUR</option>

</select>

<select id="toCurrency">

<option>INR</option>
<option>USD</option>
<option>EUR</option>

</select>

<button id="convertBtn">

Convert

</button>

<div id="result">

Result Here

</div>

</div>

<!-- AI -->

<div class="feature-card">

<h2>🤖 AI Solver</h2>

<input
type="text"
id="aiInput"
placeholder="2x+5=15">

<button id="solveBtn">

Solve

</button>

<div id="aiResult">

AI Answer

</div>

</div>

<!-- OCR -->

<div class="feature-card">

<h2>📸 OCR Scanner</h2>

<input
type="file"
id="imageInput"
accept="image/*">

<button id="scanBtn">

Scan Equation

</button>

<div id="ocrResult">

Equation result

</div>

</div>

</div>

</div>

<script src="https://unpkg.com/tesseract.js@v5.0.4/dist/tesseract.min.js"></script>

<script defer src="script.js?v=999"></script>

</body>

</html>
