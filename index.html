<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>CyberCalc X</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

</head>

<body>

<!-- Matrix Background -->

<canvas id="matrix"></canvas>

<!-- Particles -->

<div id="particles-js"></div>

<!-- Calculator -->

<div class="calculator" id="calculator">

<!-- Top Bar -->

<div class="top-bar">

<div class="logo">CyberCalc X</div>

<div class="controls">

<button id="themeToggle">🌙</button>

<button id="voiceBtn">🎤</button>

<button id="dragBtn">✥</button>

</div>

</div>

<!-- Display -->

<input type="text" id="display" disabled>

<!-- History -->

<div class="history" id="history"></div>

<!-- Scientific Toggle -->

<div class="toggle-container">

<button id="scientificToggle">

Scientific Mode

</button>

</div>

<!-- Scientific Buttons -->

<div class="scientific-buttons hidden"
id="scientificButtons">

<button onclick="appendValue('Math.sin(')">sin</button>

<button onclick="appendValue('Math.cos(')">cos</button>

<button onclick="appendValue('Math.tan(')">tan</button>

<button onclick="appendValue('Math.sqrt(')">√</button>

</div>

<!-- Main Buttons -->

<div class="buttons">

<button onclick="clearDisplay()">C</button>

<button onclick="deleteLast()">DEL</button>

<button onclick="appendValue('%')">%</button>

<button onclick="appendValue('/')">÷</button>

<button onclick="appendValue('7')">7</button>

<button onclick="appendValue('8')">8</button>

<button onclick="appendValue('9')">9</button>

<button onclick="appendValue('*')">×</button>

<button onclick="appendValue('4')">4</button>

<button onclick="appendValue('5')">5</button>

<button onclick="appendValue('6')">6</button>

<button onclick="appendValue('-')">−</button>

<button onclick="appendValue('1')">1</button>

<button onclick="appendValue('2')">2</button>

<button onclick="appendValue('3')">3</button>

<button onclick="appendValue('+')">+</button>

<button class="zero"
onclick="appendValue('0')">0</button>

<button onclick="appendValue('.')">.</button>

<button onclick="calculate()">=</button>

</div>

<!-- Currency Converter -->

<div class="converter">

<h2>Currency Converter</h2>

<div class="converter-box">

<input type="number" id="amount" placeholder="Enter Amount" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()" oninput="event.stopPropagation()">

<select id="fromCurrency">

<option value="USD">USD</option>
<option value="INR">INR</option>
<option value="EUR">EUR</option>
<option value="GBP">GBP</option>
<option value="JPY">JPY</option>

</select>

<select id="toCurrency">

<option value="INR">INR</option>
<option value="USD">USD</option>
<option value="EUR">EUR</option>
<option value="GBP">GBP</option>
<option value="JPY">JPY</option>

</select>

<button id="convertBtn">

Convert Currency

</button>

<div id="result">

Result Here

</div>

<!-- AI Math Solver -->

<div class="ai-solver">

<h2>AI Math Solver 🤖</h2>

<div class="ai-box">

<input 
type="text"
id="aiInput"
placeholder="Type equation like 2x+5=15">

<button id="solveBtn">

Solve Equation

</button>

<div id="aiResult">

AI answer will appear here

</div>

</div>

<script src="particles.js"></script>

<script defer src="script.js?v=3"></script>

<!-- Install Popup -->

<div id="installPopup">

<p>Install CyberCalc X App 🚀</p>

<button id="installBtn">

Install Now

</button>

</div>

<!-- OCR Math Scanner -->

<div class="ocr-box">

<h2>OCR Math Scanner 📸</h2>

<input
type="file"
id="imageInput"
accept="image/*">

<button id="scanBtn">

Scan Equation

</button>

<div id="ocrResult">

Equation result here

</div>

</div>


</body>

</html>
