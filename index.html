<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberCalc X</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Loader -->

<div id="loader">

<div class="spinner"></div>

<h1>CyberCalc X</h1>

</div>

<!-- Matrix Background -->

<canvas id="matrix"></canvas>

<!-- Particles -->

<div id="particles-js"></div>

<!-- Calculator -->

<div class="calculator" id="calculator">

<div class="top-bar">

<div class="logo">CyberCalc X</div>

<div class="controls">

<button id="themeToggle">🌙</button>

<button id="voiceBtn">🎤</button>

<button id="dragBtn">✥</button>

</div>

</div>

<input type="text" id="display" disabled>

<!-- History -->

<div class="history" id="history"></div>

<!-- Scientific Toggle -->

<div class="toggle-container">

<button id="scientificToggle">Scientific Mode</button>

</div>

<!-- Scientific Buttons -->

<div class="scientific-buttons hidden" id="scientificButtons">

<button onclick="appendValue('Math.sin(')">sin</button>

<button onclick="appendValue('Math.cos(')">cos</button>

<button onclick="appendValue('Math.tan(')">tan</button>

<button onclick="appendValue('Math.sqrt(')">√</button>

</div>

<!-- Main Buttons -->

<div class="buttons">

<button onclick="clearDisplay()">C</button>
<button onclick="deleteLast()">DEL</button>
<button onclick="appendValue('%')">%</button>
<button onclick="appendValue('/')">÷</button>

<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button onclick="appendValue('*')">×</button>

<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button onclick="appendValue('-')">−</button>

<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button onclick="appendValue('+')">+</button>

<button onclick="appendValue('0')" class="zero">0</button>
<button onclick="appendValue('.')">.</button>
<button onclick="calculate()">=</button>

</div>

</div>

<script src="particles.js"></script>

<script src="script.js"></script>

</body>

</html>
