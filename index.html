<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>CyberCalc X</title>

<link rel="stylesheet" href="style.css?v=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- Background -->

<div class="bg"></div>

<!-- Calculator -->

<div class="calculator">

<!-- Top -->

<div class="top-bar">

<h1 class="logo">CyberCalc X</h1>

<div class="controls">

<button>🌙</button>

<button>🎤</button>

<button>⚡</button>

</div>

</div>

<!-- Display -->

<input type="text" id="display" disabled>

<!-- Sci Button -->

<button id="scientificToggle">

Scientific Mode

</button>

<!-- Buttons -->

<div class="buttons">

<button>C</button>
<button>DEL</button>
<button>%</button>
<button class="op">÷</button>

<button>7</button>
<button>8</button>
<button>9</button>
<button class="op">×</button>

<button>4</button>
<button>5</button>
<button>6</button>
<button class="op">−</button>

<button>1</button>
<button>2</button>
<button>3</button>
<button class="op">+</button>

<button class="zero">0</button>
<button>.</button>
<button class="equal">=</button>

</div>

<!-- Currency -->

<div class="card">

<h2>💸 Currency Converter</h2>

<input type="number" placeholder="Enter Amount">

<select>
<option>USD</option>
<option>INR</option>
<option>EUR</option>
</select>

<select>
<option>INR</option>
<option>USD</option>
<option>EUR</option>
</select>

<button class="action-btn">

Convert Currency

</button>

<div class="result-box">

Result Here

</div>

</div>

<!-- AI -->

<div class="card">

<h2>🤖 AI Math Solver</h2>

<input type="text"
placeholder="2x+5=15">

<button class="action-btn">

Solve Equation

</button>

<div class="result-box">

AI Answer

</div>

</div>

<!-- OCR -->

<div class="card">

<h2>📸 OCR Scanner</h2>

<input type="file">

<button class="action-btn">

Scan Equation

</button>

<div class="result-box">

Equation Result

</div>

</div>

</div>

</body>

</html>
<script>
const display = document.getElementById("display");

function appendValue(val){
display.value += val;
}

function clearDisplay(){
display.value = "";
}

function deleteLast(){
display.value = display.value.slice(0,-1);
}

function calculate(){
try{
display.value = eval(display.value);
}
catch{
display.value = "Error";
}
}

document.querySelectorAll(".buttons button").forEach(btn=>{

const txt = btn.innerText;

if(txt==="C"){
btn.onclick=clearDisplay;
}
else if(txt==="DEL"){
btn.onclick=deleteLast;
}
else if(txt==="="){
btn.onclick=calculate;
}
else{

btn.onclick=()=>appendValue(
txt
.replace("×","*")
.replace("÷","/")
.replace("−","-")
);

}

});

/* Disable Double Tap Zoom */

let lastTouchEnd = 0;

document.addEventListener(
'touchend',
function (event) {

const now = (new Date()).getTime();

if (now - lastTouchEnd <= 300) {
event.preventDefault();
}

lastTouchEnd = now;

}, false);

</script>
